[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disinfectant-tolerance-dnabert"
version = "0.1.0"
description = "Feasibility study for genomic-language-model prediction of disinfectant tolerance."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dnabert = [
  "einops>=0.6",
  "torch>=2.1",
  "transformers>=4.36",
]
extension = [
  "xgboost>=3.2",
]
dev = [
  "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
